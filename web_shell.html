<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    :root { background: #0b102b; }
    html, body { position: fixed; inset: 0; width: 100%; height: 100%; min-width: 100%; min-height: 100%; margin: 0; padding: 0; overflow: hidden; background: #17143e; }
    body { min-height: 100dvh; touch-action: none; }
    #canvas { position: fixed; inset: 0; display: block; width: 100vw !important; height: 100vh !important; min-width: 100vw; min-height: 100vh; max-width: none; max-height: none; border: 0; outline: none; background: #17143e; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Your browser does not support the HTML canvas element.</canvas>
  <script src="$GODOT_URL?v=zombie-villager-4"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const engine = new Engine($GODOT_CONFIG);
    const cacheBustedPack = `index.pck?v=zombie-villager-4`;
    let wasLandscape = window.innerWidth >= window.innerHeight;
    let orientationReload = null;

    function redrawViewport() {
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      const isLandscape = window.innerWidth >= window.innerHeight;
      if (isLandscape !== wasLandscape) {
        wasLandscape = isLandscape;
        window.clearTimeout(orientationReload);
        orientationReload = window.setTimeout(() => window.location.reload(), 180);
      }
    }

    window.addEventListener('resize', redrawViewport, { passive: true });
    window.addEventListener('orientationchange', redrawViewport, { passive: true });
    if (screen.orientation) screen.orientation.addEventListener('change', redrawViewport, { passive: true });
    redrawViewport();
    engine.startGame({ canvas, canvasResizePolicy: 2, mainPack: cacheBustedPack });
  </script>
</body>
</html>
